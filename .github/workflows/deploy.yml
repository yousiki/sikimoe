name: Deploy

# Deployment is deliberately opt-in.
#
# Pushing to `redesign` publishes to the throwaway `siki-moe-preview` project
# (`https://siki-moe-preview.pages.dev`). Publishing to the project that serves
# siki.moe requires running this workflow by hand and picking `production`.
#
# To make production deploys automatic on `main`, add `push: branches: [main]`
# above and default `project` to `production`.

on:
  push:
    branches: [redesign]
  workflow_dispatch:
    inputs:
      target:
        description: Which Cloudflare Pages project to publish to
        type: choice
        required: true
        default: preview
        options: [preview, production]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ inputs.target == 'production' && 'production' || 'preview' }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `public/cv/` is committed, so this builds without the secret — it just
      # ships the CV as of the last `bun run cv` instead of the newest release.
      # Add a `RESUME_TOKEN` secret with read access to `yousiki/resume` to have
      # every deploy pick up the current one.
      - name: Build
        run: bun run build
        env:
          CV_GITHUB_TOKEN: ${{ secrets.RESUME_TOKEN }}

      - name: Resolve target project
        id: target
        run: |
          if [ "${{ inputs.target }}" = "production" ]; then
            echo "project=siki-moe" >> "$GITHUB_OUTPUT"
          else
            echo "project=siki-moe-preview" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy dist
            --project-name=${{ steps.target.outputs.project }}
            --branch=${{ github.ref_name }}
