version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      astro:
        patterns: ['astro', '@astrojs/*']
      tooling:
        patterns: ['eslint*', '@eslint/*', 'typescript*', 'prettier*', 'vitest', '@playwright/*']
      runtime:
        patterns: ['motion', 'lenis', 'tailwindcss', '@tailwindcss/*', '@fontsource*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
