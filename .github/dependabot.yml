version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    # TypeScript 7 drops the JS compiler API that eslint and `astro check` need.
    ignore:
      - dependency-name: typescript
        versions: ['>= 7']
    groups:
      astro:
        patterns: ['astro', '@astrojs/*']
      tooling:
        patterns: ['eslint*', '@eslint/*', 'typescript*', 'prettier*', 'vitest', '@playwright/*']
      runtime:
        patterns: ['motion', 'lenis', 'tailwindcss', '@tailwindcss/*', '@fontsource*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
