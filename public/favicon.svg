<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Siqi Yang">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b7a2ff"/>
      <stop offset="0.55" stop-color="#6fe7cf"/>
      <stop offset="1" stop-color="#ffb26b"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#08080a"/>
