    <circle cx="18" cy="18" r="2.1" opacity="0.35"/>
    <circle cx="31" cy="18" r="3.4" opacity="0.7"/>
    <circle cx="44" cy="18" r="2.0" opacity="0.3"/>
    <circle cx="18" cy="31" r="3.6" opacity="0.75"/>
    <circle cx="31" cy="31" r="5.6" opacity="1"/>
    <circle cx="44" cy="31" r="3.2" opacity="0.65"/>
    <circle cx="18" cy="44" r="2.0" opacity="0.3"/>
    <circle cx="31" cy="44" r="3.3" opacity="0.6"/>
    <circle cx="44" cy="44" r="2.2" opacity="0.38"/>
  </g>
</svg>
